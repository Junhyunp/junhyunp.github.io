# Trend 카테고리 취재원 목록
#
# trend 스킬이 이 파일을 읽어 순서대로 훑는다.
# ▶ 사람을 추가하려면 아래 형식대로 항목만 붙이면 된다. 스킬은 손댈 필요 없다.
#
# platform : threads | x | blog | youtube  (현재 threads 만 자동 조회 검증됨)
# handle   : @ 없이
# url      : 실제로 열어볼 주소. threads 는 반드시 threads.com (threads.net 은 301 리다이렉트)
# focus    : 이 사람에게서 무엇을 볼 것인가 — 스킬이 취사선택할 때 쓴다
# caution  : 인용 시 주의사항. 오해 소지가 있으면 반드시 적는다
# active   : false 로 두면 건너뛴다

sources:
  - name: CHOI
    platform: threads
    handle: choi.openai
    url: https://www.threads.com/@choi.openai
    followers: 266000        # 2026-08-12 확인
    focus: "해외 AI 소식 번역·요약. 모델·제품 출시와 규제 이슈를 빠르게 전달"
    caution: >-
      계정명이 choi.openai 라 OpenAI 소속으로 오해하기 쉽다. 실제로는 OpenAI Codex
      앰배서더이고 직원이 아니다. 인용할 때 소속을 단정하지 말 것.
      긴 글은 1/ 2/ 3/ 로 나눠 댓글에 이어 붙이므로 본문만 보면 내용이 잘린다.
    active: true

