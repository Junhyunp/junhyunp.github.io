  - id: 4
    category: Concept
    prefix: "LLM"
    title: "Temperature와 Top-p — 답변이 매번 달라지는 이유"
    slug: temperature-top-p
    tags: [LLM, temperature, top-p, sampling]
    note: >-
      샘플링 파라미터 두 개의 차이와 실제 체감. 코드 생성은 낮게, 브레인스토밍은 높게 같은 용도별 권장값.
      발행본은 여기에 두 가지를 더했다. (1) 최신 모델에서 이 파라미터가 사라지고 있다는 것 —
      Anthropic 공식 마이그레이션 문서 기준 Opus 4.7 이후 모델에서 400 오류. 2026년에 이걸 빼면 낡은 글이 된다.
      (2) '낮은 T = 항상 같은 답'이 아니라는 절 — 초보자가 가장 자주 기대하는데 보장되지 않는 지점.
      그림의 막대는 로짓 [3.0, 2.0, 1.0, 0.5]에 소프트맥스를 실제로 계산한 값이고 본문 표와 숫자가 같다.
      dataviz 검증기에서 대비 경고(2.42<3:1)가 떠서 직접 레이블 + 표 병기로 해소했다.
    status: done
    published: 2026-08-18
    post: 2026-08-18-temperature-top-p.md

  - id: 5
    category: Concept
    prefix: "LLM"
    title: "임베딩(Embedding)이란 — 의미를 숫자로 바꾸는 법"
    slug: embedding-basics
    tags: [LLM, embedding, vector, similarity]
    note: >-
      텍스트 → 벡터. 코사인 유사도로 '비슷한 문서 찾기'가 되는 원리. 검색·추천·RAG의 기반.
      발행본은 rag-basics 가 결과만 쓰고 넘어간 부분을 받는 편으로 썼고, 초보자 기준이다.
      word2vec King/Queen 예시에 유추 정확도 65.6% 를 같이 붙여 '마법이 아니다'를 못박았다.
      Sentence-BERT 의 65시간 → 5초가 RAG 색인 단계가 성립하는 이유로 연결되고,
      임베딩의 약점(철자·부정 표현)이 rag-basics 의 하이브리드 검색 권고로 되돌아가 두 글이 닫힌다.
      새 예고는 만들지 않았다 — 예고 부채 0.
    status: done
    published: 2026-08-14
    post: 2026-08-14-embedding-basics.md

  - id: 6
    category: Concept
    prefix: "LLM"
    title: "RAG 기초 — 내 문서를 LLM에 물어보게 만들기"
    slug: rag-basics
    tags: [LLM, RAG, vector db, retrieval]
    note: >-
      청킹 → 임베딩 → 벡터DB 저장 → 질문 시 검색해서 프롬프트에 붙이기.
      발행본은 초보자 기준으로 잡았고, 색인 시점과 질의 시점을 나누는 것을 뼈대로 삼았다.
      '답이 이상할 때 검색/청킹/생성 중 어디를 보나' 진단 절이 핵심.
      파인튜닝과의 선택 기준은 넣지 않았다 — #7 finetune-vs-rag 몫으로 남겨둠.
      끝에서 임베딩 편(#5)을 예고했으므로 그쪽이 부채로 남는다.
    status: done
    published: 2026-08-14
    post: 2026-08-14-rag-basics.md

  - id: 7
    category: Concept
    prefix: "LLM"
    title: "파인튜닝 vs RAG vs 프롬프트 — 무엇을 언제 쓰나"
    slug: finetune-vs-rag
    tags: [LLM, fine-tuning, RAG, prompt]
    note: >-
      비용·데이터량·업데이트 주기 기준 의사결정 표. 대부분은 프롬프트→RAG 순으로 충분하다는 결론.
      ⚠️ 발행본은 이 메모의 각도를 바꿨다. 1차 출처 두 편을 읽어보니 핵심은 "무엇이 더 좋은가"가 아니라
      "무엇을 바꾸려는가"(지시 / 모델이 보는 것 / 모델 자체)였고, 결정적으로 셋이 배타적이지 않았다.
      2401.08406 에서 파인튜닝 +6%p 위에 RAG 가 +5%p 더 얹혀 누적됐다.
      그래서 'vs' 제목이 만드는 오해를 푸는 것을 글의 뼈대로 삼았다.
      두 논문 다 2023~2024 자료라 연도를 참고란에 굵게 박았다.
    status: done
    published: 2026-08-17
    post: 2026-08-17-finetune-vs-rag.md

  # ── 프롬프트 ───────────────────────────────────────────────────
  - id: 8
    category: Concept
    prefix: "Prompt"
    title: "프롬프트 기본기 5가지 — 역할·맥락·형식·예시·제약"
    slug: prompt-basics-5
    tags: [Prompt, prompt engineering, ChatGPT]
    note: >-
      같은 질문을 나쁜 프롬프트/좋은 프롬프트로 비교. 출력 형식 명시가 체감 효과 가장 큼.
      ── 발행 후 기록 ──
      ⚠️ 이 메모의 순서를 발행본이 뒤집었다. 논문을 읽으니 형식이 가장 강하고 역할이 가장 약하다.
      "역할·맥락·형식·예시·제약"에서 역할을 맨 앞에 두는 통념 자체가 이 글의 표적이 됐다.
      ★ Zheng 외(EMNLP Findings 2024): 역할 162개·질문 2,410개·모델 4계열에서 페르소나가 성능을
        향상시키지 않았고, 최적 역할 자동 선택도 무작위보다 낫지 않았다.
      ★ Min 외(EMNLP 2022): 예시의 레이블을 무작위로 바꿔도 성능이 거의 안 떨어진다.
        실제 작동 요인은 레이블 공간·입력 분포·형식 → "예시는 정답을 가르치는 게 아니라 판을 알려준다".
      제약 항목은 통제 실험 근거를 못 찾아 "경험칙"이라고 정직하게 적었다. 억지로 붙이지 않았다.
      #9(few-shot 개수·순서)·#10(CoT) 몫은 남겨뒀다 — 콜아웃으로 "여기선 안 다룬다"만 적고 예고는 안 했다.
      한계 명시: 논문이 2022~2023 자료이고 과제도 사실질문/분류·객관식으로 한정적이다.
    status: done
    published: 2026-08-21
    post: 2026-08-21-prompt-basics-5.md

  - id: 9
    category: Concept
    prefix: "Prompt"
    title: "Few-shot 프롬프팅 — 예시 2~3개로 출력 형식 고정하기"
    slug: few-shot-prompting
    tags: [Prompt, few-shot, in-context learning]
    note: >-
      예시를 주면 형식·톤이 잡히는 이유. 예시 개수와 순서가 결과에 미치는 영향.
      ── 발행 후 기록 ──
      ⚠️ 큐 제목("예시 2~3개로 출력 형식 고정")과 결론이 반대다. 근거는 개수가 아니라 순서를 가리킨다.
      Brown 외 원논문 초록에도 권장 개수 숫자가 없다 — 개수는 근거가 약한 축이다.
      ★ Lu 외(ACL 2022): 같은 예시라도 순서만 바꾸면 성능이 "최고 수준 ~ 무작위 추측" 사이를 오간다.
        모델 크기와 무관하고, 특정 예시 묶음 탓도 아니며, 좋은 순서가 다른 모델로 이전되지 않는다.
      ★ Zhao 외(ICML 2021): 원인은 치우침 — 프롬프트 끝 근처에 놓인 답, 사전학습에 흔한 답 쪽으로 쏠린다.
        보정으로 최대 30.0%p 개선했으나 확률 접근이 필요해 챗 인터페이스에선 못 쓴다. 그래서 실무 항목에 안 넣었다.
      #8 의 Min 외(정답 무작위 교체해도 성능 유지)와 겹쳐 "예시는 정답이 아니라 판을 알려주는 것"으로 정리.
      그림에 순열 중간 분포를 그리지 않았다 — 초록이 준 건 양 끝뿐이라 점을 흩뿌리면 지어내는 게 된다. 안 그렸다고 그림에 명시.
      단서 4개: 2021~2022 자료 / 분류·객관식 위주 / 재보는 비용도 든다 / 보정 기법은 로그확률 필요.
    status: done
    published: 2026-08-25
    post: 2026-08-25-few-shot-prompting.md

  - id: 10
    category: Concept
    prefix: "Prompt"
    title: "생각의 사슬(Chain-of-Thought) — 단계별로 풀게 시키기"
    slug: chain-of-thought
    tags: [Prompt, chain-of-thought, reasoning]
    note: >-
      복잡한 계산·추론에서 '단계별로 생각해봐'가 정확도를 올리는 이유와 한계.
      ── 발행 후 기록 ──
      ★ 무게중심을 "효과"가 아니라 "설명을 믿어도 되나"에 뒀다. CoT 소개글은 보통 앞쪽만 다룬다.
      Kojima 외(NeurIPS 2022): "Let's think step by step" 한 줄로 MultiArith 17.7→78.7,
        GSM8K 10.4→40.7 (text-davinci-002). 예시 0개, 문장 하나.
      Wei 외(2022-01): "충분히 큰 모델에서 자연히 발현" → 작은 모델에선 안 나타난다.
        540B + 예시 8개로 검증기 붙인 파인튜닝 GPT-3 를 넘김.
      ★ Turpin 외(NeurIPS 2023): CoT 설명이 진짜 이유를 체계적으로 왜곡할 수 있다.
        편향 주입 시 최대 36% 하락, 모델은 편향을 언급 않고 정당화하는 근거를 지어낸다("그럴듯하지만 오도하는").
        → 근거가 붙으면 사람은 답을 더 믿는데, CoT 는 틀린 답의 신뢰도까지 올린다는 게 이 글의 결론.
      2026년 단서: 추론 모델은 CoT 를 내장하므로 프롬프트로 시키는 건 중복일 수 있다.
        temperature-top-p / qwen-38-27b 와 이어진다 — 손잡이가 프롬프트에서 추론 강도로 옮겨감.
      "36%"는 평균이 아니라 최대치라고 명시. Turpin 이 2023 자료라 "요즘은 나아졌겠지"를 쓰고 싶었지만
        확인 못 해서 "개선됐다는 근거도 확인하지 못했다"고 적었다.
      ※ Prompt 3부작(#8 기본기 → #9 few-shot → #10 CoT) 완결. 남은 #11~#13 은 성격이 다른 실무 주제.
    status: done
    published: 2026-08-28
    post: 2026-08-28-chain-of-thought.md

