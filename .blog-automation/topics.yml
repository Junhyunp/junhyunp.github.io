      거기서 책을 파쇄 스캔(destructively scanned)한다는 보도. Willison 이 2026-08-17 에 링크.
      ⚠️ 탐사보도라 검증 방식이 다르다 — 404 Media 자체가 1차 출처다. 원문을 열고, 저작권 쟁점은
      단정하지 말 것. 이 블로그가 안 다뤄본 "학습 데이터 출처" 축이고 [Policy] 접두사가 맞다.
      ── 발행 후 기록 ──
      제목을 "법원은 이미 판단했습니다"로 바꿨다. 404 Media 원문이 유료 벽이라 미리보기까지만 봤고,
      Amazon 반론 유무조차 확인 못 해서 그 기사를 글의 기둥으로 쓰지 않았다.
      대신 축을 Bartz v. Anthropic 법원 기록으로 옮겼다 — 이쪽이 공개 자료라 오히려 단단하다.
      ★ 갈라야 하는 두 갈래: 사서 파쇄 스캔한 책 = 공정 이용("본질적으로 변형적"),
        해적 사이트 다운로드·보관 = 침해 → $1.5B. 기사들이 이 둘을 상시 뒤섞는다.
      ★ 숫자도 갈라야 한다: 700만 권 = 집단 인증 범위, 482,460권 = 합의 대상, 권당 약 $3,100.
      ⚠️ "Project Panama" 인용문은 뺐다 — 출처 추적 실패. 열람 가능한 기사가 스스로 "직접 인용 아님"이라
        밝히고 제출 문서 번호를 아무도 안 단다. 뺐다는 사실 자체를 본문에 한 절로 적었다.
      ⚠️ 판결문 원문 접근 실패(Justia·CourtListener·WaPo 전부 403). 법률 매체 2곳이 독립적으로
