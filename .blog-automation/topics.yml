# blog-post 스킬이 읽어서 status: todo 인 항목을 위에서부터 꺼내 쓴다.
# 이 디렉토리는 `.` 로 시작하므로 Jekyll 빌드에서 자동 제외된다 (사이트에 노출 안 됨).
#
# status: todo | writing | done
# done 이 되면 published(YYYY-MM-DD) 와 post(파일명) 를 채운다.
#
# 축이 둘이다. category = 글의 종류, prefix = 기술 분야.
# 제목은 "[{prefix}] {title}" 형태가 된다.
#
#   category   글의 종류                        주로 쓰는 prefix
#   ─────────────────────────────────────────────────────────────────────
#   Concept    LLM·VLM 의 기본 용어와 개념       LLM, Prompt, VLM
#   Tech       레포·도구·모델 뜯어보기           Tool, Agent, IDE, Model
#   Research   최신 논문 리뷰                   Agent, VLM, LLM
#   Trend      SNS·블로그에서 포착한 이슈        Model, Policy, Market
#
# 이 4개 외에 새 카테고리를 만들지 않는다. 새 주제는 prefix 를 새로 만든다.
# 같은 prefix 가 여러 category 에 걸치는 건 의도된 것 — [Agent] 는 Tech 와 Research 양쪽에 붙어
# 두 글이 한 주제라는 걸 드러낸다.

