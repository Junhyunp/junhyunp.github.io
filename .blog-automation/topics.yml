    title: "평가 주도 개발 — 프롬프트를 고쳤는데 나아진 걸 어떻게 아나"
    slug: eval-driven-development
    tags: [LLM, evaluation, LLM-as-judge, testing]
    note: >-
      Ng 역량 지도의 여섯 칸 중 이 블로그가 안 다룬 곳이라 잡았다. 사용자가 티스토리 2차 요약을 먼저 줬으나,
      원 출처가 X 게시물 하나뿐이라 그대로 쓰지 않았다. 이후 사용자가 바탕화면 blog/ 에 원문 본문과 도표를
      직접 넣어줘서 1차 확인이 됐다. ⚠️ x.com 은 WebFetch 가 402 라 자동 조회로는 못 연다(이 세션에서 3번 막힘).
      ★ 2차 요약이 뭉갠 것 둘: (1) 6개는 최상위 4개 중 "애플리케이션 구축·배포"의 하위다.
        (2) 지도의 작성 근거 — 채용 공고 분석·구조화된 전문가 인터뷰·설문 응답.
      ★ Ng 원문: "AI 시스템을 잘 만드는 사람을 가르는 가장 중요한 특질은 훈련된 평가/오류분석 루프".
      논문 근거 2편: Zheng 외(NeurIPS 2023) LLM 심판이 사람 선호와 80%+ 일치(사람들끼리의 일치 수준),
        단 위치·장황함·자기편향. Wang 외(2023-05) 순서만 바꿔 순위 조작 가능 —
        Vicuna-13B 가 ChatGPT 를 80문항 중 66문항에서 이기게 만들었고 심판도 ChatGPT 였다.
      ★ 관통하는 패턴: few-shot 순서 / CoT 편향 / 심판 위치편향 — 세 글이 같은 곳을 가리킨다.
        "틀린 답은 보이지만 틀린 채점은 '측정했다'는 안심으로 덮인다"가 결론.
      도표는 원 이미지를 쓰지 않고 계층만 남겨 직접 다시 그렸다(참고란·캡션 양쪽에 명시).
      후속: Ng 지도 자체를 정리하는 글을 하나 더 쓴다 — 그림은 "이 블로그가 어느 칸을 채웠나"로 다르게.
