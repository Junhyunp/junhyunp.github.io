# 참고 소스 창고 (꿀팁 창고의 원재료)
#
# blog-post 스킬이 글을 쓸 때 여기서 출처를 골라 본문 하단 `## 참고` 에 링크한다.
# Jekyll 빌드 제외 디렉토리이므로 사이트에 노출되지 않는다.
#
# tier
#   1 - 1차 출처. 공식 문서 / 원논문 / 공식 repo. 인용 최우선.
#   2 - 신뢰 가능한 2차 출처. 유지보수되는 큐레이션 repo, 실명 엔지니어 블로그.
#   3 - 참고만. 검증 없이 인용 금지.
#
# verified: 이 정보를 직접 확인한 날짜 (스타 수는 이 시점 기준)
# ⚠️ SEO 양산형 블로그(제품명+가이드 도메인)는 등록하지 않는다. 대부분 서로를 베낀 요약글이다.

