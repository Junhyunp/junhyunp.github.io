<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" width="800" height="430" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', sans-serif">

  <text x="24" y="28" font-size="15" font-weight="700" fill="#808080">하네스를 자동으로 고치는 두 갈래</text>
  <text x="24" y="50" font-size="12" fill="#808080">모델 가중치는 그대로 두고, 프롬프트·도구·제어흐름만 바꿔가며 더 나은 조합을 찾는다.</text>

  <line x1="400" y1="70" x2="400" y2="374" stroke="#808080" stroke-width="1" stroke-dasharray="4 4" stroke-opacity="0.4"/>

  <!-- ══ 왼쪽: AutoDesign — 한 줄기 ══ -->
  <text x="24" y="92" font-size="13.5" font-weight="700" fill="#3FB6A8">AutoDesign — 한 줄기를 깊게</text>

  <g font-size="11.5" font-weight="600" text-anchor="middle" fill="#ffffff">
    <rect x="60" y="112" width="104" height="30" rx="5" fill="#3FB6A8" fill-opacity="0.55"/><text x="112" y="132">초기 하네스</text>
    <rect x="60" y="162" width="104" height="30" rx="5" fill="#3FB6A8" fill-opacity="0.7"/><text x="112" y="182">1차 수정</text>
    <rect x="60" y="212" width="104" height="30" rx="5" fill="#3FB6A8" fill-opacity="0.85"/><text x="112" y="232">2차 수정</text>
    <rect x="60" y="262" width="104" height="30" rx="5" fill="#3FB6A8"/><text x="112" y="282">DesignHarness</text>
  </g>

  <g stroke="#3FB6A8" stroke-width="1.5" fill="none">
    <path d="M112 142 L112 158"/><path d="M112 192 L112 208"/><path d="M112 242 L112 258"/>
  </g>
  <g fill="#3FB6A8">
    <path d="M108 152 L112 162 L116 152 Z"/><path d="M108 202 L112 212 L116 202 Z"/><path d="M108 252 L112 262 L116 252 Z"/>
  </g>

  <g font-size="11.5" fill="#808080">
    <text x="182" y="156">실행 기록에서 반복되는 실패를 찾고</text>
    <text x="182" y="206">한 번에 구성요소 하나만 고친다</text>
    <text x="182" y="256">개발셋 성능이 안 떨어질 때만 수용</text>
  </g>

  <rect x="24" y="318" width="352" height="56" rx="6" fill="#3FB6A8" fill-opacity="0.12" stroke="#3FB6A8" stroke-opacity="0.45"/>
  <text x="40" y="341" font-size="13" font-weight="700" fill="#808080">→ 개선은 쌓이지만 갈래는 하나뿐</text>
  <text x="40" y="362" font-size="12" fill="#808080">한 번 지나친 선택지로는 되돌아가지 않는다</text>

  <!-- ══ 오른쪽: DarwinX — 개체군 ══ -->
  <text x="424" y="92" font-size="13.5" font-weight="700" fill="#A66BBE">DarwinX — 개체군을 넓게</text>

  <g stroke="#A66BBE" stroke-width="1.5" fill="none" stroke-opacity="0.8">
    <path d="M505 136 L455 166"/><path d="M505 136 L555 166"/>
    <path d="M455 192 L455 222"/><path d="M555 192 L555 222"/>
    <path d="M455 248 L505 276"/><path d="M555 248 L505 276"/>
  </g>

  <g font-size="11.5" font-weight="600" text-anchor="middle" fill="#ffffff">
    <rect x="474" y="110" width="62" height="26" rx="5" fill="#A66BBE" fill-opacity="0.5"/><text x="505" y="128">시작</text>
    <rect x="424" y="166" width="62" height="26" rx="5" fill="#A66BBE" fill-opacity="0.65"/><text x="455" y="184">갈래 A</text>
    <rect x="524" y="166" width="62" height="26" rx="5" fill="#A66BBE" fill-opacity="0.65"/><text x="555" y="184">갈래 B</text>
    <rect x="424" y="222" width="62" height="26" rx="5" fill="#A66BBE" fill-opacity="0.8"/><text x="455" y="240">강점 A</text>
    <rect x="524" y="222" width="62" height="26" rx="5" fill="#A66BBE" fill-opacity="0.8"/><text x="555" y="240">강점 B</text>
    <rect x="474" y="276" width="62" height="26" rx="5" fill="#A66BBE"/><text x="505" y="294">합침</text>
  </g>

  <g font-size="11.5" fill="#808080">
    <text x="600" y="182">탈락한 갈래도</text>
    <text x="600" y="197">보관해 둔다</text>
    <text x="600" y="290">둘이 풀던 문제를</text>
    <text x="600" y="305">모두 덮을 때만 채택</text>
  </g>

  <rect x="424" y="318" width="352" height="56" rx="6" fill="#A66BBE" fill-opacity="0.12" stroke="#A66BBE" stroke-opacity="0.45"/>
  <text x="440" y="341" font-size="13" font-weight="700" fill="#808080">→ 여러 갈래를 동시에 들고 간다</text>
  <text x="440" y="362" font-size="12" fill="#808080">강점이 다른 갈래끼리 합쳐 범위를 넓힌다</text>

  <text x="24" y="398" font-size="11" fill="#808080">※ 두 논문의 초록·방법 절 서술을 탐색 구조만 남겨 다시 그린 것입니다. 원문에는 이런 그림이 없습니다.</text>
  <text x="24" y="414" font-size="11" fill="#808080">   AutoDesign 은 포스터 생성, DarwinX 는 터미널·웹 과제로 실험 대상이 서로 다릅니다.</text>
</svg>
