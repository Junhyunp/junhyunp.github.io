<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', sans-serif">

  <text x="24" y="26" font-size="15" font-weight="700" fill="#808080">심판을 한 번 만들고 끝내지 않습니다 — 네 단계로 굴립니다</text>
  <text x="24" y="48" font-size="12" fill="#808080">각 단계가 실제로 무엇을 내놓는지와, 논문이 밝힌 규모를 함께 적었습니다.</text>

  <g font-size="11">
    <rect x="25" y="76" width="165" height="104" rx="7" fill="#3FB6A8" fill-opacity="0.14" stroke="#3FB6A8" stroke-width="1.4"/>
    <text x="107" y="98" font-size="12" font-weight="700" fill="#3FB6A8" text-anchor="middle">I. 탄생</text>
    <text x="107" y="112" font-size="9.5" fill="#808080" text-anchor="middle">Birth</text>
    <text x="107" y="134" fill="#808080" text-anchor="middle">기준을 정하고</text>
    <text x="107" y="149" fill="#808080" text-anchor="middle">사람이 채점한</text>
    <text x="107" y="164" fill="#808080" text-anchor="middle">벤치마크를 만든다</text>

    <rect x="220" y="76" width="165" height="104" rx="7" fill="#3FB6A8" fill-opacity="0.14" stroke="#3FB6A8" stroke-width="1.4"/>
    <text x="302" y="98" font-size="12" font-weight="700" fill="#3FB6A8" text-anchor="middle">II. 훈련</text>
    <text x="302" y="112" font-size="9.5" fill="#808080" text-anchor="middle">Training · RART</text>
    <text x="302" y="134" fill="#808080" text-anchor="middle">채점 기준표(루브릭)</text>
    <text x="302" y="149" font-weight="700" fill="#A66BBE" text-anchor="middle">텍스트만</text>
    <text x="302" y="164" fill="#808080" text-anchor="middle">고쳐 쓴다</text>

    <rect x="415" y="76" width="165" height="104" rx="7" fill="#3FB6A8" fill-opacity="0.14" stroke="#3FB6A8" stroke-width="1.4"/>
    <text x="497" y="98" font-size="12" font-weight="700" fill="#3FB6A8" text-anchor="middle">III. 배포</text>
    <text x="497" y="112" font-size="9.5" fill="#808080" text-anchor="middle">Deployment</text>
    <text x="497" y="134" fill="#808080" text-anchor="middle">통과 여부를 막고</text>
    <text x="497" y="149" fill="#808080" text-anchor="middle">떨어뜨린 이유를</text>
    <text x="497" y="164" fill="#808080" text-anchor="middle">고쳐쓰기 지시로 쓴다</text>

    <rect x="610" y="76" width="165" height="104" rx="7" fill="#A66BBE" fill-opacity="0.16" stroke="#A66BBE" stroke-width="1.4"/>
    <text x="692" y="98" font-size="12" font-weight="700" fill="#A66BBE" text-anchor="middle">IV. 모니터링</text>
    <text x="692" y="112" font-size="9.5" fill="#808080" text-anchor="middle">Monitoring</text>
    <text x="692" y="134" fill="#808080" text-anchor="middle">매주 사람이 다시 채점해</text>
    <text x="692" y="149" fill="#808080" text-anchor="middle">심판이 밀렸는지</text>
    <text x="692" y="164" fill="#808080" text-anchor="middle">본다</text>
  </g>

  <path d="M190 128 L218 128 M380 128 L413 128 M580 128 L608 128" stroke="#808080" stroke-width="1.4" stroke-opacity="0.55" fill="none"/>
  <path d="M212 123 L219 128 L212 133 M407 123 L414 128 L407 133 M602 123 L609 128 L602 133" stroke="#808080" stroke-width="1.4" stroke-opacity="0.55" fill="none"/>

  <g font-size="10" fill="#808080" text-anchor="middle">
    <text x="107" y="200">약 900건 · 실패가 54%</text>
    <text x="302" y="200">모델·프롬프트는 고정</text>
    <text x="497" y="200">재시도 3회 · 75%↑ 통과</text>
    <text x="692" y="200">매주 300건 · 3인 이상</text>
  </g>

  <path d="M692 210 L692 240 L302 240 L302 186" stroke="#A66BBE" stroke-width="1.4" stroke-opacity="0.75" fill="none" stroke-dasharray="5 4"/>
  <path d="M297 193 L302 186 L307 193" stroke="#A66BBE" stroke-width="1.4" stroke-opacity="0.75" fill="none"/>
  <text x="497" y="258" font-size="10.5" font-weight="700" fill="#A66BBE" text-anchor="middle">밀렸으면 루브릭을 다시 고친다 — 단, 사람 검토를 거쳐야 배포된다</text>

  <line x1="24" y1="278" x2="776" y2="278" stroke="#808080" stroke-width="1" stroke-opacity="0.25"/>
  <text x="24" y="296" font-size="11" fill="#808080">※ "밀렸다"의 기준은 절대 점수가 아니라 <tspan font-weight="700">사람 채점자들끼리의 불일치 폭</tspan>입니다. 사람 평균에서 표준편차 2배 아래로 내려가면 밀린 것으로 봅니다.</text>
  <text x="24" y="312" font-size="11" fill="#808080">※ 점선 경로(드리프트 → 재튜닝)는 <tspan font-weight="700">아직 실제로 발동한 적이 없다</tspan>고 저자들이 밝혔습니다. 모니터링만 돌고 있고 대응은 오프라인 검증까지입니다.</text>
  <text x="24" y="328" font-size="11" fill="#808080">※ 2026-09-02 에 arXiv 2608.18300v1 본문에서 확인한 값입니다.</text>
</svg>
