<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 372" width="800" height="372" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', sans-serif">

  <text x="24" y="26" font-size="15" font-weight="700" fill="#808080">같은 표 안의 다섯 행 — ALFWorld 평균 성공률</text>
  <text x="24" y="48" font-size="12" fill="#808080">EvoHarness-RL 논문 표 1에서 옮겼습니다. 어느 행을 고르느냐로 결론이 바뀝니다.</text>

  <text x="24" y="80" font-size="10.5" font-weight="700" fill="#3FB6A8">Qwen3-8B — 이 논문이 이 환경에서 직접 훈련시킨 모델</text>
  <line x1="24" y1="86" x2="776" y2="86" stroke="#808080" stroke-width="1" stroke-opacity="0.3"/>

  <g font-size="11.5" fill="#808080">
    <text x="240" y="113" text-anchor="end">ReAct</text>
    <rect x="250" y="96" width="168" height="24" rx="4" fill="#3FB6A8" fill-opacity="0.25"/>
    <text x="605" y="113" font-size="12.5" font-weight="700" fill="#3FB6A8">47.9%</text>

    <text x="240" y="151" text-anchor="end">SkillOS</text>
    <rect x="250" y="134" width="281" height="24" rx="4" fill="#3FB6A8" fill-opacity="0.5"/>
    <text x="605" y="151" font-size="12.5" font-weight="700" fill="#3FB6A8">80.2%</text>
    <text x="655" y="151" font-size="9.5">기존 최강</text>

    <text x="240" y="189" text-anchor="end" font-weight="700">EvoHarness-RL</text>
    <rect x="250" y="172" width="339" height="24" rx="4" fill="#3FB6A8"/>
    <text x="605" y="189" font-size="12.5" font-weight="700" fill="#3FB6A8">96.9%</text>
    <text x="655" y="189" font-size="9.5">기사 제목의 근거</text>
  </g>

  <text x="24" y="222" font-size="10.5" font-weight="700" fill="#A66BBE">Claude Opus 4.5 — 훈련 없이 그대로 쓴 모델</text>
  <line x1="24" y1="228" x2="776" y2="228" stroke="#808080" stroke-width="1" stroke-opacity="0.3"/>

  <g font-size="11.5" fill="#808080">
    <text x="240" y="255" text-anchor="end">ReAct</text>
    <rect x="250" y="238" width="337" height="24" rx="4" fill="#A66BBE" fill-opacity="0.45"/>
    <text x="605" y="255" font-size="12.5" font-weight="700" fill="#A66BBE">96.4%</text>
    <text x="655" y="255" font-size="9.5">기사가 고른 상대</text>

    <text x="240" y="293" text-anchor="end" font-weight="700">EvoHarness-Base</text>
    <rect x="250" y="276" width="345" height="24" rx="4" fill="#A66BBE"/>
    <text x="605" y="293" font-size="12.5" font-weight="700" fill="#A66BBE">98.5%</text>
    <text x="655" y="293" font-size="9.5">기사에 없는 행</text>
  </g>

  <line x1="24" y1="322" x2="776" y2="322" stroke="#808080" stroke-width="1" stroke-opacity="0.25"/>
  <text x="24" y="342" font-size="11" fill="#808080">※ 벤치마크는 ALFWorld 하나입니다. 방을 돌아다니며 물건을 다루는 텍스트 가사 과제이고, 평가는 seen 스플릿 140과제입니다.</text>
  <text x="24" y="358" font-size="11" fill="#808080">   Claude·GPT 에는 RL 을 적용할 수 없어 EvoHarness-Base 까지만 있습니다. 표 자체는 그 사실을 숨기지 않았습니다.</text>
</svg>
