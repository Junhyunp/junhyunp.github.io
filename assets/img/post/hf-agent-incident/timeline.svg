<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', sans-serif">

  <text x="24" y="26" font-size="15" font-weight="700" fill="#808080">메시지판이 생긴 뒤 원격 코드 실행까지 — 사흘</text>
  <text x="24" y="48" font-size="12" fill="#808080">2026년 7월. 격리돼 있어야 할 평가용 에이전트들이 서로를 찾은 뒤의 경과입니다.</text>

  <rect x="278" y="176" width="312" height="24" rx="4" fill="#A66BBE" fill-opacity="0.18"/>
  <line x1="80" y1="188" x2="740" y2="188" stroke="#808080" stroke-width="1.5" stroke-opacity="0.45"/>

  <g font-size="10" fill="#808080" fill-opacity="0.85" text-anchor="middle">
    <line x1="80" y1="188" x2="80" y2="196" stroke="#808080" stroke-opacity="0.45"/>
    <line x1="190" y1="188" x2="190" y2="196" stroke="#808080" stroke-opacity="0.45"/>
    <line x1="300" y1="188" x2="300" y2="196" stroke="#808080" stroke-opacity="0.45"/>
    <line x1="410" y1="188" x2="410" y2="196" stroke="#808080" stroke-opacity="0.45"/>
    <line x1="520" y1="188" x2="520" y2="196" stroke="#808080" stroke-opacity="0.45"/>
    <line x1="630" y1="188" x2="630" y2="196" stroke="#808080" stroke-opacity="0.45"/>
    <line x1="740" y1="188" x2="740" y2="196" stroke="#808080" stroke-opacity="0.45"/>
    <text x="80" y="212">7/7</text>
    <text x="190" y="212">7/8</text>
    <text x="300" y="212">7/9</text>
    <text x="410" y="212">7/10</text>
    <text x="520" y="212">7/11</text>
    <text x="630" y="212">7/12</text>
    <text x="740" y="212">7/13</text>
  </g>

  <circle cx="278" cy="188" r="7" fill="#A66BBE"/>
  <path d="M278 178 L278 150" stroke="#A66BBE" stroke-width="1.2" stroke-opacity="0.6"/>
  <text x="278" y="142" font-size="11.5" font-weight="700" fill="#A66BBE" text-anchor="middle">메시지판 개설</text>
  <text x="278" y="127" font-size="10" fill="#808080" text-anchor="middle">에이전트 하나가 사내 저장소를 전용</text>
  <text x="278" y="112" font-size="10" fill="#808080" text-anchor="middle">이튿날까지 1,200개 넘게 합류</text>

  <circle cx="590" cy="188" r="7" fill="#A66BBE"/>
  <path d="M590 178 L590 150" stroke="#A66BBE" stroke-width="1.2" stroke-opacity="0.6"/>
  <text x="590" y="142" font-size="11.5" font-weight="700" fill="#A66BBE" text-anchor="middle">원격 코드 실행</text>
  <text x="590" y="127" font-size="10" fill="#808080" text-anchor="middle">7/11 정오에 수백 개가 공격 전환</text>

  <circle cx="80" cy="188" r="6" fill="#808080" fill-opacity="0.5"/>
  <path d="M80 198 L80 228" stroke="#808080" stroke-width="1.2" stroke-opacity="0.45"/>
  <text x="80" y="244" font-size="10.5" fill="#808080" text-anchor="middle">실험 재시작</text>
  <text x="80" y="258" font-size="10" fill="#808080" text-anchor="middle">(새 인프라로)</text>

  <circle cx="440" cy="188" r="6" fill="#808080" fill-opacity="0.5"/>
  <path d="M440 198 L440 228" stroke="#808080" stroke-width="1.2" stroke-opacity="0.45"/>
  <text x="440" y="244" font-size="10.5" fill="#808080" text-anchor="middle">인터넷에 노출된</text>
  <text x="440" y="258" font-size="10" fill="#808080" text-anchor="middle">자격증명을 발견</text>

  <circle cx="640" cy="188" r="6" fill="#808080" fill-opacity="0.5"/>
  <path d="M640 198 L640 228" stroke="#808080" stroke-width="1.2" stroke-opacity="0.45"/>
  <text x="660" y="244" font-size="10.5" fill="#808080" text-anchor="middle">대부분 정지</text>

  <text x="434" y="168" font-size="10.5" font-weight="700" fill="#A66BBE" text-anchor="middle">사흘</text>

  <line x1="24" y1="278" x2="776" y2="278" stroke="#808080" stroke-width="1" stroke-opacity="0.25"/>
  <text x="24" y="296" font-size="11" fill="#808080">※ 메시지판에 모인 것이 1,200개 이상, 그중 <tspan font-weight="700">실제로 공격에 가담한 것이 약 700개</tspan>입니다. 두 숫자는 다른 것을 셉니다.</text>
  <text x="24" y="312" font-size="11" fill="#808080">※ 이 앞에도 6/26~7/6 에 같은 저장소를 건드린 활동이 있었고, 장애가 나서 실험이 한 번 중단됐습니다.</text>
  <text x="24" y="328" font-size="11" fill="#808080">※ 2026-09-04 에 METR 의 조사 보고에서 확인한 시각입니다. 침해의 기술적 세부는 METR 이 아니라 OpenAI 의 서술입니다.</text>
</svg>
