<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', sans-serif">

  <text x="24" y="28" font-size="15" font-weight="700" fill="#808080">하네스를 누가 고치는가 — 자동화의 층위</text>

  <!-- 축 -->
  <line x1="40" y1="368" x2="40" y2="62" stroke="#808080" stroke-width="1.5" stroke-opacity="0.5"/>
  <path d="M36 70 L40 58 L44 70 Z" fill="#808080" fill-opacity="0.6"/>
  <text x="20" y="215" font-size="12" fill="#808080" text-anchor="middle" transform="rotate(-90 20 215)">사람의 개입이 줄어든다</text>

  <!-- L0 -->
  <rect x="60" y="330" width="420" height="42" rx="5" fill="#808080" fill-opacity="0.25" stroke="#808080" stroke-opacity="0.5"/>
  <text x="76" y="349" font-size="13" font-weight="700" fill="#808080">사람이 직접 쓴다</text>
  <text x="76" y="365" font-size="11.5" fill="#808080">프롬프트 · 워크플로 · 도구를 손으로 설계</text>

  <!-- L1 -->
  <rect x="60" y="272" width="450" height="42" rx="5" fill="#5B8DEF" fill-opacity="0.3" stroke="#5B8DEF" stroke-opacity="0.6"/>
  <text x="76" y="291" font-size="13" font-weight="700" fill="#808080">컨텍스트 관리를 자동화</text>
  <text x="76" y="307" font-size="11.5" fill="#808080">무엇을 넣고 뺄지 시스템이 정한다</text>

  <!-- L2 -->
  <rect x="60" y="214" width="480" height="42" rx="5" fill="#3FB6A8" fill-opacity="0.3" stroke="#3FB6A8" stroke-opacity="0.6"/>
  <text x="76" y="233" font-size="13" font-weight="700" fill="#808080">워크플로 설계를 자동화</text>
  <text x="76" y="249" font-size="11.5" fill="#808080">에이전트 구성 자체를 탐색으로 찾는다</text>

  <!-- L3 -->
  <rect x="60" y="156" width="510" height="42" rx="5" fill="#F0A04B" fill-opacity="0.35" stroke="#F0A04B" stroke-opacity="0.7"/>
  <text x="76" y="175" font-size="13" font-weight="700" fill="#808080">하네스가 자기를 고친다</text>
  <text x="76" y="191" font-size="11.5" fill="#808080">약점을 찾아 자기 프롬프트·스킬·메모리를 수정</text>

  <!-- L4 -->
  <rect x="60" y="98" width="540" height="42" rx="5" fill="#A66BBE" fill-opacity="0.4" stroke="#A66BBE" stroke-opacity="0.8"/>
  <text x="76" y="117" font-size="13" font-weight="700" fill="#808080">하네스와 모델을 함께</text>
  <text x="76" y="133" font-size="11.5" fill="#808080">하네스 개선과 가중치 갱신을 같은 루프에서</text>

  <!-- 우리 글 위치 -->
  <g font-size="11.5" fill="#F0A04B">
    <path d="M574 177 L640 177" stroke="#F0A04B" stroke-width="1.5" fill="none"/>
    <circle cx="574" cy="177" r="3.5" fill="#F0A04B"/>
    <text x="648" y="174">Prime Agent</text>
    <text x="648" y="189" fill="#808080" font-size="10.5">/refine</text>
  </g>
  <g font-size="11.5" fill="#A66BBE">
    <path d="M604 119 L640 119" stroke="#A66BBE" stroke-width="1.5" fill="none"/>
    <circle cx="604" cy="119" r="3.5" fill="#A66BBE"/>
    <text x="648" y="116">Continual Harness</text>
    <text x="648" y="131" fill="#808080" font-size="10.5">논문</text>
  </g>

  <!-- 상단 단서 -->
  <rect x="60" y="46" width="700" height="38" rx="6" fill="#E05C5C" fill-opacity="0.12" stroke="#E05C5C" stroke-opacity="0.45"/>
  <text x="76" y="70" font-size="12.5" font-weight="600" fill="#808080">위로 갈수록 사람이 덜 개입할 뿐, 기반 모델의 지능을 대체하지는 못한다</text>

  <!-- 하단 주석 -->
  <text x="60" y="398" font-size="11" fill="#808080">※ Lilian Weng, "Harness Engineering for Self-Improvement"(2026-07) 의 구성을 층위로 다시 그린 것입니다.</text>
  <text x="60" y="414" font-size="11" fill="#808080">   원문은 이 순서를 단계로 규정하지 않습니다.</text>
</svg>
