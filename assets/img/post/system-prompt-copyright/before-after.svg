  <text x="204" y="286" font-size="11" fill="#808080" text-anchor="middle" fill-opacity="0.8">저작권 관련 항목 없음</text>

  <line x1="24" y1="346" x2="776" y2="346" stroke="#808080" stroke-width="1" stroke-opacity="0.25"/>
  <text x="24" y="364" font-size="11" fill="#808080">※ 다만 IP 관련 알림(ip_reminder)은 <tspan font-weight="700">7월 프롬프트에도 이미 있었습니다.</tspan> 9월에 새로 생긴 것은 본문의 명시적 조항입니다.</text>
  <text x="24" y="378" font-size="11" fill="#808080">※ 2026-09-06 에 platform.claude.com 의 공개 문서에서 직접 대조했습니다. 이 프롬프트들은 앱용이고 API 에는 적용되지 않습니다.</text>
