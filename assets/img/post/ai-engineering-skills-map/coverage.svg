<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', sans-serif">

  <text x="24" y="28" font-size="15" font-weight="700" fill="#808080">여섯 칸에 이 블로그 23편을 대보면</text>
  <text x="24" y="50" font-size="12" fill="#808080">그 주제를 정면으로 다룬 글만 셌습니다. 스치듯 걸치는 소식 글은 괄호로 따로 적었습니다.</text>

  <text x="176" y="80" font-size="10.5" font-weight="700" text-anchor="end" fill="#808080">Ng 의 여섯 역량</text>
  <text x="196" y="80" font-size="10.5" font-weight="700" fill="#808080">정면으로 다룬 글</text>
  <line x1="24" y1="86" x2="776" y2="86" stroke="#808080" stroke-width="1" stroke-opacity="0.3"/>

  <g font-size="11.5" fill="#808080">
    <text x="176" y="112" font-weight="700" text-anchor="end">LLM 기초</text>
    <rect x="196" y="98" width="160" height="20" rx="4" fill="#3FB6A8"/>
    <text x="366" y="112" font-size="12" font-weight="700" fill="#3FB6A8">4편</text>
    <text x="410" y="112" font-size="10.5">토큰 · 컨텍스트 · 환각 · Temperature   (+ 소식 3편)</text>

    <text x="176" y="150" font-weight="700" text-anchor="end">데이터 그라운딩</text>
    <rect x="196" y="136" width="120" height="20" rx="4" fill="#3FB6A8"/>
    <text x="326" y="150" font-size="12" font-weight="700" fill="#3FB6A8">3편</text>
    <text x="410" y="150" font-size="10.5">RAG · 임베딩 · 파인튜닝 vs RAG</text>

    <text x="176" y="188" font-weight="700" text-anchor="end">에이전트 시스템</text>
    <rect x="196" y="174" width="160" height="20" rx="4" fill="#3FB6A8" fill-opacity="0.55"/>
    <text x="366" y="188" font-size="12" font-weight="700" fill="#3FB6A8">4편</text>
    <text x="410" y="188" font-size="10.5" fill="#A66BBE">전부 하네스 자기개선 — 안전·거버넌스는 0편</text>

    <text x="176" y="226" font-weight="700" text-anchor="end">평가 주도 개발</text>
    <rect x="196" y="212" width="40" height="20" rx="4" fill="#3FB6A8"/>
    <text x="246" y="226" font-size="12" font-weight="700" fill="#3FB6A8">1편</text>
    <text x="410" y="226" font-size="10.5">바로 앞 글에서 겨우 채움</text>

    <text x="176" y="264" font-weight="700" text-anchor="end">프로덕션 운영</text>
    <rect x="196" y="252" width="6" height="20" rx="3" fill="#A66BBE" fill-opacity="0.4"/>
    <text x="216" y="264" font-size="12" font-weight="700" fill="#A66BBE">0편</text>
    <text x="410" y="264" font-size="10.5">관측·드리프트·회귀 테스트·비용 최적화</text>

    <text x="176" y="302" font-weight="700" text-anchor="end">ML 기초</text>
    <rect x="196" y="290" width="6" height="20" rx="3" fill="#A66BBE" fill-opacity="0.4"/>
    <text x="216" y="302" font-size="12" font-weight="700" fill="#A66BBE">0편</text>
    <text x="410" y="302" font-size="10.5">편향/분산 · 오류분석 · 데이터 엔지니어링</text>
  </g>

  <line x1="24" y1="322" x2="776" y2="322" stroke="#808080" stroke-width="1" stroke-opacity="0.25"/>
  <text x="24" y="344" font-size="11" fill="#808080">※ 나머지 8편(정책·산업 소식·도구)은 이 지도에 해당 칸이 없습니다. 지도는 "만드는 일"만 다루기 때문입니다.</text>
  <text x="24" y="360" font-size="11" fill="#808080">   빈칸이 곧 결함은 아닙니다. 다만 어디가 비었는지는 대보기 전에는 보이지 않았습니다.</text>
</svg>
