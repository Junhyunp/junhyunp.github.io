<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', sans-serif">

  <text x="24" y="26" font-size="15" font-weight="700" fill="#808080">지표를 바꾸면 1위가 바뀝니다 — 같은 실험, 같은 조건들</text>
  <text x="24" y="48" font-size="12" fill="#808080">SwarmWorld 3,200 tick · 에이전트 100개. 논문에서 확인한 값만 실었습니다.</text>

  <text x="24" y="80" font-size="10.5" font-weight="700" fill="#808080">검증된 발명 수 (많을수록)</text>
  <g font-size="11" fill="#808080">
    <text x="250" y="103" text-anchor="end">환경 흔적만</text>
    <rect x="260" y="88" width="300" height="20" rx="4" fill="#3FB6A8" fill-opacity="0.55"/>
    <text x="572" y="103" font-size="12" font-weight="700" fill="#3FB6A8">7.00</text>
    <text x="630" y="103" font-size="9.5" fill="#3FB6A8">← 1위</text>

    <text x="250" y="129" text-anchor="end">대화·상속 다 있음</text>
    <rect x="260" y="114" width="246" height="20" rx="4" fill="#3FB6A8"/>
    <text x="572" y="129" font-size="12" font-weight="700" fill="#3FB6A8">5.75</text>

    <text x="250" y="155" text-anchor="end">혼자 탐색</text>
    <rect x="260" y="140" width="118" height="20" rx="4" fill="#A66BBE"/>
    <text x="572" y="155" font-size="12" font-weight="700" fill="#A66BBE">2.75</text>
  </g>

  <text x="24" y="186" font-size="10.5" font-weight="700" fill="#808080">포트폴리오 회복력 (높을수록)</text>
  <g font-size="11" fill="#808080">
    <text x="250" y="209" text-anchor="end">대화·상속 다 있음</text>
    <rect x="260" y="194" width="186" height="20" rx="4" fill="#3FB6A8"/>
    <text x="572" y="209" font-size="12" font-weight="700" fill="#3FB6A8">0.2474</text>
    <text x="630" y="209" font-size="9.5" fill="#3FB6A8">← 1위</text>

    <text x="250" y="235" text-anchor="end">환경 흔적만</text>
    <rect x="260" y="220" width="177" height="20" rx="4" fill="#3FB6A8" fill-opacity="0.55"/>
    <text x="572" y="235" font-size="12" font-weight="700" fill="#3FB6A8">0.2365</text>

    <text x="250" y="261" text-anchor="end">혼자 탐색</text>
    <rect x="260" y="246" width="135" height="20" rx="4" fill="#A66BBE"/>
    <text x="572" y="261" font-size="12" font-weight="700" fill="#A66BBE">0.1794</text>
  </g>

  <text x="24" y="292" font-size="10.5" font-weight="700" fill="#808080">가장 좋은 단일 산출물 (높을수록)</text>
  <g font-size="11" fill="#808080">
    <text x="250" y="315" text-anchor="end">혼자 탐색</text>
    <rect x="260" y="300" width="262" height="20" rx="4" fill="#A66BBE"/>
    <text x="572" y="315" font-size="12" font-weight="700" fill="#A66BBE">0.3488</text>
    <text x="630" y="315" font-size="9.5" fill="#A66BBE">← 1위</text>

    <text x="250" y="341" text-anchor="end">대화·상속 다 있음</text>
    <rect x="260" y="326" width="179" height="20" rx="4" fill="#3FB6A8"/>
    <text x="572" y="341" font-size="12" font-weight="700" fill="#3FB6A8">0.2380</text>

    <text x="250" y="367" text-anchor="end">환경 흔적만</text>
    <text x="264" y="367" font-size="10.5" fill="#808080" fill-opacity="0.75">이 지표의 값은 확인하지 못해 비워 뒀습니다</text>
  </g>

  <line x1="24" y1="384" x2="776" y2="384" stroke="#808080" stroke-width="1" stroke-opacity="0.25"/>
  <text x="24" y="402" font-size="11" fill="#808080">※ 아래 둘은 0~1 점수라 같은 축을 씁니다. 맨 위는 개수라 축이 다릅니다 — 칸 길이를 세 묶음 사이에서 비교하지 마십시오.</text>
  <text x="24" y="416" font-size="11" fill="#808080">   네 번째 조건(메시지만 없앤 no communication)은 이 세 값을 확인하지 못해 넣지 않았습니다.</text>
</svg>
