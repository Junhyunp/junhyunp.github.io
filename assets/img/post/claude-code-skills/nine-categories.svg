<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', sans-serif">

  <text x="24" y="28" font-size="15" font-weight="700" fill="#808080">아홉 분류에 실제 스킬 세트를 대보면</text>
  <text x="24" y="50" font-size="12" fill="#808080">Anthropic 이 공개한 분류에, 제가 쓰는 스킬 10개를 하나씩 대응시킨 결과입니다.</text>

  <text x="44" y="80" font-size="10.5" font-weight="700" fill="#808080">Anthropic 의 아홉 분류</text>
  <text x="330" y="80" font-size="10.5" font-weight="700" fill="#808080">내 세트</text>
  <line x1="24" y1="86" x2="776" y2="86" stroke="#808080" stroke-width="1" stroke-opacity="0.3"/>

  <g font-size="11.5" fill="#808080">
    <rect x="24" y="92" width="752" height="30" rx="4" fill="#808080" fill-opacity="0.05"/>
    <text x="44" y="112">1 · 라이브러리·API 레퍼런스</text>
    <text x="292" y="112" font-size="12" font-weight="700" fill="#A66BBE">✕</text>
    <text x="330" y="112" fill="#808080">없음</text>

    <rect x="24" y="126" width="752" height="30" rx="4" fill="#A66BBE" fill-opacity="0.14"/>
    <text x="44" y="146" font-weight="700">2 · 제품 검증</text>
    <text x="292" y="146" font-size="12" font-weight="700" fill="#A66BBE">✕</text>
    <text x="330" y="146" font-weight="700" fill="#A66BBE">없음 — 가장 값어치 있다고 지목된 칸</text>

    <rect x="24" y="160" width="752" height="30" rx="4" fill="#808080" fill-opacity="0.05"/>
    <text x="44" y="180">3 · 데이터 조회·분석</text>
    <text x="292" y="180" font-size="12" font-weight="700" fill="#808080">△</text>
    <text x="330" y="180">trend — 웹 취재원만, 데이터 스택 아님</text>

    <rect x="24" y="194" width="752" height="30" rx="4" fill="#3FB6A8" fill-opacity="0.14"/>
    <text x="44" y="214" font-weight="700">4 · 업무 프로세스 자동화</text>
    <text x="292" y="214" font-size="12" font-weight="700" fill="#3FB6A8">✓</text>
    <text x="330" y="214" font-weight="700" fill="#3FB6A8">6개 — blog-post · trend · daily-log · manage-todo · make-plan · gotchas</text>

    <rect x="24" y="228" width="752" height="30" rx="4" fill="#3FB6A8" fill-opacity="0.08"/>
    <text x="44" y="248">5 · 코드 스캐폴딩·템플릿</text>
    <text x="292" y="248" font-size="12" font-weight="700" fill="#3FB6A8">✓</text>
    <text x="330" y="248">spec-sheet</text>

    <rect x="24" y="262" width="752" height="30" rx="4" fill="#3FB6A8" fill-opacity="0.08"/>
    <text x="44" y="282">6 · 코드 품질·리뷰</text>
    <text x="292" y="282" font-size="12" font-weight="700" fill="#3FB6A8">✓</text>
    <text x="330" y="282">like-redteam</text>

    <rect x="24" y="296" width="752" height="30" rx="4" fill="#808080" fill-opacity="0.05"/>
    <text x="44" y="316">7 · CI/CD·배포</text>
    <text x="292" y="316" font-size="12" font-weight="700" fill="#808080">△</text>
    <text x="330" y="316">blog-post 이 겸함 (push = 배포)</text>

    <rect x="24" y="330" width="752" height="30" rx="4" fill="#3FB6A8" fill-opacity="0.08"/>
    <text x="44" y="350">8 · 런북</text>
    <text x="292" y="350" font-size="12" font-weight="700" fill="#3FB6A8">✓</text>
    <text x="330" y="350">check_issue — 증상 → 다중 도구 조사 → 구조화된 리포트</text>

    <rect x="24" y="364" width="752" height="30" rx="4" fill="#808080" fill-opacity="0.05"/>
    <text x="44" y="384">9 · 인프라 운영</text>
    <text x="292" y="384" font-size="12" font-weight="700" fill="#A66BBE">✕</text>
    <text x="330" y="384" fill="#808080">없음</text>
  </g>

  <text x="24" y="422" font-size="11" fill="#808080">※ skill-creator 는 Anthropic 번들이라 분류 대상에서 뺐습니다. 10개 중 9개가 마크다운 파일 한 장입니다.</text>
  <text x="24" y="438" font-size="11" fill="#808080">   검증이 없는 게 아니라 blog-post 안에 규칙으로 묻혀 있습니다 — 독립 스킬이 아닐 뿐입니다.</text>
</svg>
