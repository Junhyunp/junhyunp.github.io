<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', sans-serif">

  <text x="24" y="28" font-size="15" font-weight="700" fill="#808080">Flash 는 3.7 안정판, Pro 의 최신은 3.1 프리뷰입니다</text>
  <text x="24" y="50" font-size="12" fill="#808080">두 계열이 같은 속도로 가고 있지 않습니다. 아래는 공식 모델 목록에 실제로 올라와 있는 것들입니다.</text>

  <text x="24" y="112" font-size="12" font-weight="700" fill="#3FB6A8">Flash 계열</text>

  <g font-size="12" font-weight="600" text-anchor="middle" fill="#ffffff">
    <rect x="150" y="84" width="150" height="44" rx="6" fill="#3FB6A8" fill-opacity="0.4"/><text x="225" y="111">3.5 Flash</text>
    <rect x="320" y="84" width="150" height="44" rx="6" fill="#3FB6A8" fill-opacity="0.65"/><text x="395" y="111">3.6 Flash</text>
    <rect x="490" y="84" width="150" height="44" rx="6" fill="#3FB6A8"/><text x="565" y="111">3.7 Flash</text>
  </g>

  <g stroke="#3FB6A8" stroke-width="1.5" fill="none">
    <path d="M302 106 L314 106"/><path d="M472 106 L484 106"/>
  </g>
  <g fill="#3FB6A8">
    <path d="M314 102 L322 106 L314 110 Z"/><path d="M484 102 L492 106 L484 110 Z"/>
  </g>

  <g font-size="10.5" text-anchor="middle" fill="#808080">
    <text x="395" y="146">2026-07-21</text>
    <text x="565" y="146">2026-08-13</text>
  </g>
  <text x="660" y="111" font-size="11" font-weight="700" fill="#3FB6A8">← 23일 만</text>

  <text x="24" y="212" font-size="12" font-weight="700" fill="#A66BBE">Pro 계열</text>

  <g font-size="12" font-weight="600" text-anchor="middle" fill="#ffffff">
    <rect x="150" y="184" width="150" height="44" rx="6" fill="#A66BBE" fill-opacity="0.55"/><text x="225" y="211">2.5 Pro</text>
  </g>
  <rect x="320" y="184" width="170" height="44" rx="6" fill="none" stroke="#A66BBE" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="405" y="205" font-size="12" font-weight="600" text-anchor="middle" fill="#A66BBE">3.1 Pro</text>
  <text x="405" y="221" font-size="10.5" text-anchor="middle" fill="#A66BBE">프리뷰</text>

  <g font-size="10.5" text-anchor="middle" fill="#808080">
    <text x="225" y="246">안정판</text>
  </g>

  <text x="510" y="200" font-size="11" fill="#808080">Flash 가 3.5 → 3.7 로 가는 동안</text>
  <text x="510" y="216" font-size="11" fill="#808080">Pro 는 3.1 에서 아직 프리뷰입니다.</text>

  <text x="24" y="274" font-size="11" fill="#808080">※ 2026-08-18 구글 공식 모델 목록(ai.google.dev) 기준입니다. Gemini 3.5 Pro 는 목록에 없습니다.</text>
  <text x="24" y="290" font-size="11" fill="#808080">   버전 번호는 계열별로 매겨지므로 Flash 3.7 과 Pro 3.1 을 같은 축의 세대 차로 읽으면 안 됩니다.</text>
</svg>
