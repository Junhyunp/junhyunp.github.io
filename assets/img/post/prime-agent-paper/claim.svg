<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', sans-serif">

  <text x="24" y="26" font-size="15" font-weight="700" fill="#808080">대표 수치 — ARC-AGI-3 RHAE, 한 번에 맞힌 최고 점수</text>
  <text x="24" y="48" font-size="12" fill="#808080">양쪽 모두 "모델 + 하네스" 입니다. 바뀐 것은 모델이 아니라 모델을 감싼 쪽이라는 게 논문의 주장입니다.</text>

  <g font-size="11.5" fill="#808080">
    <text x="250" y="102" text-anchor="end">기존 하네스</text>
    <text x="250" y="117" font-size="10" text-anchor="end" fill="#808080" fill-opacity="0.8">Claude Code · Codex</text>
    <rect x="260" y="90" width="120" height="30" rx="4" fill="#808080" fill-opacity="0.4"/>
    <text x="392" y="111" font-size="13" font-weight="700" fill="#808080">30%</text>

    <text x="250" y="168" text-anchor="end" font-weight="700">Prime Agent</text>
    <rect x="260" y="156" width="382" height="30" rx="4" fill="#3FB6A8"/>
    <text x="654" y="177" font-size="13" font-weight="700" fill="#3FB6A8">95.5%</text>
  </g>

  <line x1="260" y1="82" x2="260" y2="196" stroke="#808080" stroke-width="1" stroke-opacity="0.4"/>
  <text x="260" y="210" font-size="10" fill="#808080" text-anchor="middle">0%</text>
  <text x="660" y="210" font-size="10" fill="#808080" text-anchor="middle">100%</text>

  <rect x="24" y="228" width="752" height="76" rx="7" fill="#A66BBE" fill-opacity="0.1" stroke="#A66BBE" stroke-width="1.2"/>
  <text x="40" y="250" font-size="11.5" font-weight="700" fill="#A66BBE">이 그림으로 답할 수 없는 것 둘</text>
  <text x="40" y="270" font-size="11" fill="#808080">1. <tspan font-weight="700">두 실행의 모델이 같았는지</tspan> — 논문이 두 수치 사이에서 모델을 구분해 밝히지 않았습니다.</text>
  <text x="40" y="291" font-size="11" fill="#808080">2. <tspan font-weight="700">하네스의 어느 부분이 올렸는지</tspan> — 구성요소를 하나씩 빼보는 실험(어블레이션)이 없습니다.</text>

  <text x="24" y="322" font-size="11" fill="#808080">※ 2026-09-02 에 arXiv 2608.23552v1 본문에서 확인했습니다. 표 1 의 비교 대상은 Pi-mono · Claude Code · Codex 입니다.</text>
</svg>
