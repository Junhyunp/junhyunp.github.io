<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', sans-serif">

  <text x="24" y="28" font-size="15" font-weight="700" fill="#808080">셋은 경쟁 관계가 아니라 건드리는 층이 다릅니다</text>
  <text x="24" y="50" font-size="12" fill="#808080">"무엇이 더 좋은가"가 아니라 "무엇을 바꾸려는가"로 물어야 답이 나옵니다.</text>

  <line x1="66" y1="86" x2="66" y2="256" stroke="#808080" stroke-width="1.3" stroke-opacity="0.5"/>
  <path d="M62 250 L66 262 L70 250 Z" fill="#808080" fill-opacity="0.5"/>
  <text x="24" y="82" font-size="10.5" fill="#808080">먼저</text>
  <text x="24" y="278" font-size="10.5" fill="#808080">나중에</text>

  <rect x="92" y="84" width="618" height="54" rx="6" fill="#3FB6A8" fill-opacity="0.45"/>
  <text x="112" y="117" font-size="13" font-weight="700" fill="#ffffff">프롬프트</text>
  <text x="250" y="112" font-size="11.5" fill="#ffffff">지시를 바꾼다</text>
  <text x="470" y="112" font-size="11.5" fill="#ffffff">바로 반영된다</text>

  <rect x="92" y="150" width="618" height="54" rx="6" fill="#3FB6A8" fill-opacity="0.8"/>
  <text x="112" y="183" font-size="13" font-weight="700" fill="#ffffff">RAG</text>
  <text x="250" y="178" font-size="11.5" fill="#ffffff">모델이 보는 것을 바꾼다</text>
  <text x="470" y="178" font-size="11.5" fill="#ffffff">문서만 갈아끼우면 된다</text>

  <rect x="92" y="216" width="618" height="54" rx="6" fill="#A66BBE"/>
  <text x="112" y="249" font-size="13" font-weight="700" fill="#ffffff">파인튜닝</text>
  <text x="250" y="244" font-size="11.5" fill="#ffffff">모델 자체를 바꾼다</text>
  <text x="470" y="244" font-size="11.5" fill="#ffffff">다시 학습해야 한다</text>

  <text x="722" y="117" font-size="10.5" fill="#3FB6A8">모델 밖</text>
  <text x="722" y="183" font-size="10.5" fill="#3FB6A8">모델 밖</text>
  <text x="722" y="249" font-size="10.5" fill="#A66BBE">모델 안</text>

  <text x="24" y="300" font-size="11" fill="#808080">※ 아래로 갈수록 비용과 되돌리기 어려움이 커집니다. 그래서 위에서부터 시도합니다.</text>
  <text x="24" y="316" font-size="11" fill="#808080">   다만 배타적이지 않습니다 — 한 논문의 실험에서는 파인튜닝과 RAG의 효과가 더해졌습니다.</text>
</svg>
