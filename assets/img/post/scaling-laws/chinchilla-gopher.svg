<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', sans-serif">

  <text x="24" y="26" font-size="15" font-weight="700" fill="#808080">같은 연산 예산을 어디에 쓸 것인가 — 두 모델의 선택</text>
  <text x="24" y="48" font-size="12" fill="#808080">Chinchilla 논문이 자기 주장을 증명하려고 직접 학습시켜 비교한 두 모델입니다.</text>

  <text x="235" y="82" font-size="11" font-weight="700" fill="#808080" text-anchor="middle">파라미터 수</text>
  <text x="595" y="82" font-size="11" font-weight="700" fill="#808080" text-anchor="middle">학습에 쓴 토큰 수</text>

  <g font-size="11.5" fill="#808080">
    <text x="100" y="122" text-anchor="end">Gopher</text>
    <rect x="110" y="105" width="233" height="26" rx="4" fill="#A66BBE"/>
    <text x="351" y="123" font-size="12" font-weight="700" fill="#A66BBE">280B</text>
    <rect x="470" y="105" width="50" height="26" rx="4" fill="#A66BBE" fill-opacity="0.5"/>
    <text x="528" y="123" font-size="12" font-weight="700" fill="#A66BBE">300B</text>

    <text x="100" y="172" text-anchor="end" font-weight="700">Chinchilla</text>
    <rect x="110" y="155" width="58" height="26" rx="4" fill="#3FB6A8"/>
    <text x="176" y="173" font-size="12" font-weight="700" fill="#3FB6A8">70B</text>
    <rect x="470" y="155" width="233" height="26" rx="4" fill="#3FB6A8"/>
    <text x="711" y="173" font-size="12" font-weight="700" fill="#3FB6A8">1.4T</text>
  </g>

  <text x="235" y="208" font-size="11" fill="#808080" text-anchor="middle">4분의 1로 줄이고</text>
  <text x="595" y="208" font-size="11" fill="#808080" text-anchor="middle">4배 넘게 더 먹였습니다</text>

  <line x1="24" y1="228" x2="776" y2="228" stroke="#808080" stroke-width="1" stroke-opacity="0.3"/>

  <text x="400" y="254" font-size="13" font-weight="700" fill="#3FB6A8" text-anchor="middle">작은 쪽이 이겼습니다 — Chinchilla 가 MMLU 67.5%</text>
  <text x="400" y="274" font-size="11" fill="#808080" text-anchor="middle">논문 표현으로 Gopher 대비 "7% 이상의 개선". GPT-3(175B)·Jurassic-1(178B)·MT-NLG(530B) 도 함께 앞섰습니다.</text>

  <line x1="24" y1="292" x2="776" y2="292" stroke="#808080" stroke-width="1" stroke-opacity="0.25"/>
  <text x="24" y="310" font-size="11" fill="#808080">※ 두 칸은 단위가 달라 각자의 축을 씁니다. 파라미터 칸과 토큰 칸의 막대 길이를 가로질러 비교하지 마십시오.</text>
  <text x="24" y="326" font-size="11" fill="#808080">※ 2026-09-04 에 arXiv 2203.15556 초록·본문에서 확인한 값입니다.</text>
</svg>
