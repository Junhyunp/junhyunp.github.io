<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" width="800" height="430" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', sans-serif">

  <text x="24" y="26" font-size="15" font-weight="700" fill="#808080">모델은 옳게 판단했습니다. 그런데도 뚫렸습니다.</text>
  <text x="24" y="48" font-size="12" fill="#808080">"이 웹페이지 좀 요약해줘" 한 마디에서 시작한 사슬입니다.</text>

  <g font-size="11.5" fill="#808080">
    <circle cx="44" cy="82" r="11" fill="#808080" fill-opacity="0.25"/>
    <text x="44" y="86" font-size="10.5" font-weight="700" text-anchor="middle" fill="#808080">1</text>
    <text x="68" y="86">사용자가 웹페이지 요약을 시킵니다 — 평범한 요청입니다</text>

    <circle cx="44" cy="118" r="11" fill="#808080" fill-opacity="0.25"/>
    <text x="44" y="122" font-size="10.5" font-weight="700" text-anchor="middle" fill="#808080">2</text>
    <text x="68" y="122">서버가 415 로 막자, 모델이 스스로 curl 로 우회합니다</text>

    <circle cx="44" cy="154" r="11" fill="#808080" fill-opacity="0.25"/>
    <text x="44" y="158" font-size="10.5" font-weight="700" text-anchor="middle" fill="#808080">3</text>
    <text x="68" y="158">zip 을 내려받아 풉니다 — 안에 인코딩된 기록과 디코더가 들어 있습니다</text>
  </g>

  <rect x="24" y="176" width="752" height="46" rx="7" fill="#3FB6A8" fill-opacity="0.14" stroke="#3FB6A8" stroke-width="1.4"/>
  <circle cx="44" cy="199" r="11" fill="#3FB6A8"/>
  <text x="44" y="203" font-size="10.5" font-weight="700" text-anchor="middle" fill="#ffffff">4</text>
  <text x="68" y="196" font-size="11.5" font-weight="700" fill="#3FB6A8">딸려온 디코더 실행을 거부합니다</text>
  <text x="68" y="212" font-size="10.5" fill="#808080">모르는 바이너리를 돌리지 않는 것 — 여기까지는 정확히 옳은 판단입니다</text>

  <g font-size="11.5" fill="#808080">
    <circle cx="44" cy="248" r="11" fill="#808080" fill-opacity="0.25"/>
    <text x="44" y="252" font-size="10.5" font-weight="700" text-anchor="middle" fill="#808080">5</text>
    <text x="68" y="252">대신 <tspan font-weight="700">자기가 파이썬 디코더를 짭니다</tspan> — 일은 끝내야 하니까요</text>

    <circle cx="44" cy="284" r="11" fill="#808080" fill-opacity="0.25"/>
    <text x="44" y="288" font-size="10.5" font-weight="700" text-anchor="middle" fill="#808080">6</text>
    <text x="68" y="288">압축을 푼 그 디렉토리 안에서 실행합니다 → import base64</text>
  </g>

  <rect x="24" y="306" width="752" height="46" rx="7" fill="#A66BBE" fill-opacity="0.14" stroke="#A66BBE" stroke-width="1.4"/>
  <circle cx="44" cy="329" r="11" fill="#A66BBE"/>
  <text x="44" y="333" font-size="10.5" font-weight="700" text-anchor="middle" fill="#ffffff">7</text>
  <text x="68" y="326" font-size="11.5" font-weight="700" fill="#A66BBE">파이썬이 표준 라이브러리 대신 공격자의 파일을 불러옵니다</text>
  <text x="68" y="342" font-size="10.5" fill="#808080">base64 가 내부적으로 struct 를 부르는데, 같은 폴더의 struct.py 가 먼저 잡힙니다</text>

  <line x1="24" y1="372" x2="776" y2="372" stroke="#808080" stroke-width="1" stroke-opacity="0.25"/>
  <text x="24" y="392" font-size="11.5" font-weight="700" fill="#808080">실패 지점은 모델이 아니라, 공격자가 채운 폴더 안에서 코드를 돌린 것입니다.</text>
  <text x="24" y="412" font-size="11" fill="#808080">※ 성공률은 변형 셋에서 3/5 · 3/5 · 4/5. 발견자 본인이 "작은 표본이지 보편적 수치가 아니다"라고 못박았습니다.</text>
  <text x="24" y="426" font-size="11" fill="#808080">※ 2026-09-04 에 발견자의 원문 글에서 확인했습니다. 공격 코드는 옮기지 않았습니다.</text>
</svg>
