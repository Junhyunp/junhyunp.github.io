<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', sans-serif">

  <text x="24" y="30" font-size="15" font-weight="700" fill="#808080">표식이 있다 / 없다가 뜻하는 것</text>

  <!-- ── 케이스 1 : Claude 생성 → 표식 O ── -->
  <text x="24" y="72" font-size="13" font-weight="700" fill="#808080">① Claude 가 생성</text>
  <g font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">
    <rect x="24"  y="86" width="150" height="34" rx="5" fill="#5B8DEF"/><text x="99"  y="108">Claude 생성</text>
    <rect x="206" y="86" width="110" height="34" rx="5" fill="#3FB6A8"/><text x="261" y="108">표식 있음</text>
  </g>
  <path d="M178 103 L200 103" stroke="#808080" stroke-width="1.5"/>
  <path d="M194 99 L204 103 L194 107 Z" fill="#808080"/>
  <text x="336" y="107" font-size="13" fill="#3FB6A8">→ 맞게 잡아냅니다</text>

  <!-- ── 케이스 2 : 사람이 쓰고 Claude 로 다듬음 → 표식 O ── -->
  <text x="24" y="164" font-size="13" font-weight="700" fill="#808080">② 사람이 쓰고 Claude 로 다듬음</text>
  <g font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">
    <rect x="24"  y="178" width="86"  height="34" rx="5" fill="#A66BBE"/><text x="67"  y="200">사람이 씀</text>
    <rect x="142" y="178" width="118" height="34" rx="5" fill="#5B8DEF"/><text x="201" y="200">Claude 로 교정</text>
    <rect x="292" y="178" width="110" height="34" rx="5" fill="#3FB6A8"/><text x="347" y="200">표식 있음</text>
  </g>
  <g stroke="#808080" stroke-width="1.5" fill="#808080">
    <path d="M114 195 L136 195" fill="none"/><path d="M130 191 L140 195 L130 199 Z"/>
    <path d="M264 195 L286 195" fill="none"/><path d="M280 191 L290 195 L280 199 Z"/>
  </g>
  <text x="422" y="199" font-size="13" fill="#E05C5C">→ 저자는 사람인데 표식이 붙습니다</text>

  <!-- ── 케이스 3 : Claude 생성 후 크게 고침 → 표식 X ── -->
  <text x="24" y="256" font-size="13" font-weight="700" fill="#808080">③ Claude 생성 후 크게 고치거나 번역</text>
  <g font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">
    <rect x="24"  y="270" width="106" height="34" rx="5" fill="#5B8DEF"/><text x="77"  y="292">Claude 생성</text>
    <rect x="162" y="270" width="130" height="34" rx="5" fill="#A66BBE"/><text x="227" y="292">대폭 수정·번역</text>
    <rect x="324" y="270" width="118" height="34" rx="5" fill="#E05C5C"/><text x="383" y="292">표식 사라짐</text>
  </g>
  <g stroke="#808080" stroke-width="1.5" fill="#808080">
    <path d="M134 287 L156 287" fill="none"/><path d="M150 283 L160 287 L150 291 Z"/>
    <path d="M296 287 L318 287" fill="none"/><path d="M312 283 L322 287 L312 291 Z"/>
  </g>
  <text x="462" y="291" font-size="13" fill="#E05C5C">→ AI 가 썼는데 못 잡습니다</text>

  <!-- 결론 -->
  <rect x="24" y="330" width="752" height="52" rx="6" fill="#5B8DEF" fill-opacity="0.12" stroke="#5B8DEF" stroke-opacity="0.4"/>
  <text x="44" y="352" font-size="13.5" font-weight="700" fill="#808080">표식은 "누가 썼는가"가 아니라 "Claude를 거쳤는가"에 대한 신호입니다</text>
  <text x="44" y="372" font-size="12.5" fill="#808080">공식 문서도 단정적이지 않다(not fully conclusive)고 명시합니다</text>
</svg>
