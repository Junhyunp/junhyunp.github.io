<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', sans-serif">

  <text x="24" y="26" font-size="15" font-weight="700" fill="#808080">대표 수치에는 "잘 됐나" 말고도 네 가지가 더 섞여 있습니다</text>
  <text x="24" y="48" font-size="12" fill="#808080">종합 Skill Lift 는 여섯 항목을 각 1/6 로 평균한 값입니다. 그중 결과 지표는 둘뿐입니다.</text>

  <g font-size="10.5">
    <rect x="40" y="76" width="115" height="34" rx="5" fill="#808080" fill-opacity="0.22"/>
    <text x="97" y="97" fill="#808080" text-anchor="middle">security</text>
    <rect x="163" y="76" width="115" height="34" rx="5" fill="#808080" fill-opacity="0.22"/>
    <text x="220" y="97" fill="#808080" text-anchor="middle">skill_execution</text>
    <rect x="286" y="76" width="115" height="34" rx="5" fill="#808080" fill-opacity="0.22"/>
    <text x="343" y="97" fill="#808080" text-anchor="middle">skill_efficiency</text>
    <rect x="409" y="76" width="115" height="34" rx="5" fill="#808080" fill-opacity="0.22"/>
    <text x="466" y="97" fill="#808080" text-anchor="middle">behavior_check</text>

    <rect x="532" y="76" width="112" height="34" rx="5" fill="#3FB6A8"/>
    <text x="588" y="97" fill="#ffffff" font-weight="700" text-anchor="middle">accuracy</text>
    <rect x="648" y="76" width="112" height="34" rx="5" fill="#3FB6A8"/>
    <text x="704" y="97" fill="#ffffff" font-weight="700" text-anchor="middle">goal_accuracy</text>
  </g>

  <text x="282" y="130" font-size="10.5" fill="#808080" text-anchor="middle">과정·안전 지표 넷</text>
  <text x="646" y="130" font-size="10.5" font-weight="700" fill="#3FB6A8" text-anchor="middle">실제로 잘 해냈나 — 둘</text>

  <text x="185" y="176" font-size="11.5" font-weight="700" fill="#808080" text-anchor="end">종합 (여섯 항목)</text>
  <rect x="195" y="160" width="512" height="24" rx="4" fill="#808080" fill-opacity="0.45"/>
  <text x="717" y="177" font-size="12.5" font-weight="700" fill="#808080">0.2134</text>

  <text x="185" y="214" font-size="11.5" font-weight="700" fill="#3FB6A8" text-anchor="end">결과만 (두 항목)</text>
  <rect x="195" y="198" width="432" height="24" rx="4" fill="#3FB6A8"/>
  <text x="637" y="215" font-size="12.5" font-weight="700" fill="#3FB6A8">0.1799</text>

  <line x1="195" y1="150" x2="195" y2="232" stroke="#808080" stroke-width="1" stroke-opacity="0.4"/>
  <text x="195" y="246" font-size="10" fill="#808080" text-anchor="middle">0</text>

  <text x="400" y="272" font-size="12" font-weight="700" fill="#808080" text-anchor="middle">스킬을 붙였을 때 좋아진 정도. 결과만 보면 대표 수치보다 낮습니다.</text>

  <line x1="24" y1="288" x2="776" y2="288" stroke="#808080" stroke-width="1" stroke-opacity="0.25"/>
  <text x="24" y="306" font-size="11" fill="#808080">※ 항목 배열 순서는 읽기 편하도록 제가 묶은 것입니다. 여섯 항목의 가중치는 모두 같아서 순서에는 의미가 없습니다.</text>
  <text x="24" y="322" font-size="11" fill="#808080">※ 2026-09-02 에 arXiv 2608.20614v1 본문에서 확인했습니다. 종합값의 95% 신뢰구간은 [0.1967, 0.2301] 입니다.</text>
</svg>
