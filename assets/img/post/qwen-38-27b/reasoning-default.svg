<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', sans-serif">

  <text x="24" y="28" font-size="15" font-weight="700" fill="#808080">기본값으로 돌리면 생성 토큰의 87%가 추론에 쓰입니다</text>
  <text x="24" y="50" font-size="12" fill="#808080">Simon Willison 이 맥북에서 같은 요청(펠리컨 SVG)을 두 조건으로 돌려 잰 값입니다.</text>

  <text x="100" y="90" font-size="11.5" font-weight="600" text-anchor="end" fill="#808080">토큰 구성</text>
  <text x="100" y="105" font-size="10.5" text-anchor="end" fill="#808080">기본값 xhigh</text>

  <rect x="110" y="80" width="412" height="28" rx="4" fill="#A66BBE"/>
  <rect x="524" y="80" width="60" height="28" rx="4" fill="#3FB6A8"/>

  <text x="122" y="99" font-size="11.5" font-weight="700" fill="#ffffff">추론 22,276</text>
  <text x="584" y="125" font-size="10.5" text-anchor="end" fill="#3FB6A8">출력 3,223</text>
  <text x="122" y="125" font-size="10.5" fill="#A66BBE">전체 생성 토큰의 87%</text>

  <line x1="110" y1="158" x2="584" y2="158" stroke="#808080" stroke-width="1" stroke-opacity="0.25"/>

  <text x="100" y="190" font-size="11.5" font-weight="600" text-anchor="end" fill="#808080">걸린 시간</text>

  <text x="100" y="217" font-size="10.5" text-anchor="end" fill="#808080">기본값 xhigh</text>
  <rect x="110" y="200" width="474" height="24" rx="4" fill="#A66BBE" fill-opacity="0.75"/>
  <text x="598" y="217" font-size="13" font-weight="700" fill="#A66BBE">21분</text>

  <text x="100" y="253" font-size="10.5" text-anchor="end" fill="#808080">추론 끔</text>
  <rect x="110" y="236" width="52" height="24" rx="4" fill="#3FB6A8"/>
  <text x="176" y="253" font-size="13" font-weight="700" fill="#3FB6A8">137초</text>

  <text x="24" y="290" font-size="11" fill="#808080">※ 같은 모델, 같은 요청입니다. 추론 강도만 바꿨습니다 — 약 9배 차이입니다.</text>
  <text x="24" y="306" font-size="11" fill="#808080">   단발 요청 기준이며, Qwen 은 멀티턴 에이전트 작업에서는 이야기가 다르다고 적어두었습니다.</text>
</svg>
