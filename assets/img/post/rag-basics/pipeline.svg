<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', sans-serif">

  <text x="24" y="28" font-size="15" font-weight="700" fill="#808080">RAG 는 두 시점으로 나뉩니다</text>
  <text x="24" y="50" font-size="12" fill="#808080">색인은 문서가 바뀔 때만, 검색과 생성은 질문이 들어올 때마다 일어납니다.</text>

  <!-- ══ ① 색인 ══ -->
  <text x="24" y="88" font-size="12.5" font-weight="700" fill="#3FB6A8">① 미리 한 번 — 색인</text>

  <g font-size="11.5" font-weight="600" text-anchor="middle" fill="#ffffff">
    <rect x="24" y="106" width="170" height="34" rx="5" fill="#3FB6A8" fill-opacity="0.55"/><text x="109" y="128">문서 모음</text>
    <rect x="24" y="162" width="170" height="34" rx="5" fill="#3FB6A8" fill-opacity="0.75"/><text x="109" y="184">청크로 자르기</text>
    <rect x="24" y="218" width="170" height="34" rx="5" fill="#3FB6A8"/><text x="109" y="240">임베딩 → 벡터</text>
  </g>

  <g stroke="#3FB6A8" stroke-width="1.5" fill="none">
    <path d="M109 140 L109 158"/><path d="M109 196 L109 214"/>
  </g>
  <g fill="#3FB6A8">
    <path d="M105 152 L109 162 L113 152 Z"/><path d="M105 208 L109 218 L113 208 Z"/>
  </g>

  <g font-size="10.5" fill="#808080">
    <text x="24" y="284">문서가 바뀔 때만</text>
    <text x="24" y="299">다시 하면 됩니다</text>
  </g>

  <!-- ══ 벡터 저장소 ══ -->
  <rect x="300" y="150" width="110" height="110" rx="6" fill="none" stroke="#808080" stroke-width="1.5" stroke-opacity="0.55"/>
  <g font-size="11.5" font-weight="700" text-anchor="middle" fill="#808080">
    <text x="355" y="198">벡터</text>
    <text x="355" y="216">저장소</text>
  </g>
  <text x="355" y="240" font-size="10" text-anchor="middle" fill="#808080">가까운 것을</text>
  <text x="355" y="253" font-size="10" text-anchor="middle" fill="#808080">빨리 찾아줍니다</text>

  <g stroke="#3FB6A8" stroke-width="1.5" fill="none">
    <path d="M194 235 L292 235"/>
  </g>
  <path d="M292 231 L302 235 L292 239 Z" fill="#3FB6A8"/>

  <g stroke="#A66BBE" stroke-width="1.5" fill="none">
    <path d="M410 209 L458 209"/>
  </g>
  <path d="M458 205 L468 209 L458 213 Z" fill="#A66BBE"/>

  <!-- ══ ② 질의 ══ -->
  <text x="470" y="88" font-size="12.5" font-weight="700" fill="#A66BBE">② 물어볼 때마다 — 검색과 생성</text>

  <g font-size="11.5" font-weight="600" text-anchor="middle" fill="#ffffff">
    <rect x="470" y="106" width="190" height="30" rx="5" fill="#A66BBE" fill-opacity="0.45"/><text x="565" y="126">질문</text>
    <rect x="470" y="150" width="190" height="30" rx="5" fill="#A66BBE" fill-opacity="0.6"/><text x="565" y="170">질문도 임베딩</text>
    <rect x="470" y="194" width="190" height="30" rx="5" fill="#A66BBE" fill-opacity="0.75"/><text x="565" y="214">가까운 청크 k개</text>
    <rect x="470" y="238" width="190" height="30" rx="5" fill="#A66BBE" fill-opacity="0.88"/><text x="565" y="258">프롬프트 조립</text>
    <rect x="470" y="282" width="190" height="30" rx="5" fill="#A66BBE"/><text x="565" y="302">LLM 답변</text>
  </g>

  <g stroke="#A66BBE" stroke-width="1.5" fill="none">
    <path d="M565 136 L565 146"/><path d="M565 180 L565 190"/>
    <path d="M565 224 L565 234"/><path d="M565 268 L565 278"/>
  </g>
  <g fill="#A66BBE">
    <path d="M561 142 L565 150 L569 142 Z"/><path d="M561 186 L565 194 L569 186 Z"/>
    <path d="M561 230 L565 238 L569 230 Z"/><path d="M561 274 L565 282 L569 274 Z"/>
  </g>

  <g font-size="10.5" fill="#808080">
    <text x="670" y="163">질문도 같은 방식으로</text>
    <text x="670" y="176">바꿔야 비교됩니다</text>
    <text x="670" y="207">리랭커로 순서를</text>
    <text x="670" y="220">다시 고칩니다</text>
    <text x="670" y="251">"문서에 없으면</text>
    <text x="670" y="264">모른다"를 넣습니다</text>
  </g>

  <text x="24" y="412" font-size="11" fill="#808080">※ 두 시점이 나뉘는 것이 핵심입니다. 색인 비용은 한 번, 검색과 생성 비용은 질문마다 듭니다.</text>
  <text x="24" y="428" font-size="11" fill="#808080">   답이 이상할 때는 프롬프트보다 "어떤 청크가 넘어갔는지"를 먼저 봐야 합니다.</text>
</svg>
