<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', sans-serif">

  <text x="24" y="28" font-size="15" font-weight="700" fill="#808080">같은 회사, 같은 사건, 정반대 결론</text>
  <text x="24" y="50" font-size="12" fill="#808080">Bartz v. Anthropic 에서 법원은 책의 출처에 따라 두 갈래를 완전히 다르게 판단했습니다.</text>

  <text x="24" y="86" font-size="12" font-weight="700" fill="#3FB6A8">① 사서 스캔한 책</text>

  <g font-size="11" font-weight="600" text-anchor="middle" fill="#ffffff">
    <rect x="24" y="96" width="128" height="48" rx="5" fill="#3FB6A8" fill-opacity="0.5"/>
    <text x="88" y="116">중고·절판본</text><text x="88" y="132">대량 구매</text>
    <rect x="160" y="96" width="128" height="48" rx="5" fill="#3FB6A8" fill-opacity="0.65"/>
    <text x="224" y="116">제본 절단</text><text x="224" y="132">스캔</text>
    <rect x="296" y="96" width="128" height="48" rx="5" fill="#3FB6A8" fill-opacity="0.8"/>
    <text x="360" y="124">원본 폐기</text>
    <rect x="432" y="96" width="128" height="48" rx="5" fill="#3FB6A8"/>
    <text x="496" y="124">모델 학습</text>
  </g>

  <g stroke="#3FB6A8" stroke-width="1.4" fill="none">
    <path d="M152 120 L156 120"/><path d="M288 120 L292 120"/><path d="M424 120 L428 120"/>
  </g>

  <rect x="580" y="96" width="196" height="48" rx="6" fill="none" stroke="#3FB6A8" stroke-width="2"/>
  <text x="678" y="118" font-size="14" font-weight="700" text-anchor="middle" fill="#3FB6A8">공정 이용</text>
  <text x="678" y="135" font-size="10" text-anchor="middle" fill="#808080">"본질적으로 변형적"</text>

  <line x1="24" y1="172" x2="776" y2="172" stroke="#808080" stroke-width="1" stroke-opacity="0.25"/>

  <text x="24" y="198" font-size="12" font-weight="700" fill="#A66BBE">② 해적 사이트에서 받은 책</text>

  <g font-size="11" font-weight="600" text-anchor="middle" fill="#ffffff">
    <rect x="24" y="208" width="128" height="48" rx="5" fill="#A66BBE" fill-opacity="0.6"/>
    <text x="88" y="228">LibGen · PiLiMi</text><text x="88" y="244">다운로드</text>
    <rect x="160" y="208" width="128" height="48" rx="5" fill="#A66BBE"/>
    <text x="224" y="228">"중앙 도서관"</text><text x="224" y="244">으로 보관</text>
  </g>

  <g stroke="#A66BBE" stroke-width="1.4" fill="none">
    <path d="M152 232 L156 232"/>
  </g>

  <rect x="580" y="208" width="196" height="48" rx="6" fill="#A66BBE" fill-opacity="0.15" stroke="#A66BBE" stroke-width="2"/>
  <text x="678" y="230" font-size="14" font-weight="700" text-anchor="middle" fill="#A66BBE">침해</text>
  <text x="678" y="247" font-size="10" text-anchor="middle" fill="#808080">→ 15억 달러 합의</text>

  <text x="24" y="300" font-size="11" fill="#808080">※ 2025-06 Alsup 판사 약식판결과 2025-08 합의를 법률 분석 두 곳을 통해 확인해 정리했습니다.</text>
  <text x="24" y="316" font-size="11" fill="#808080">   파쇄 자체가 문제가 된 게 아닙니다. 갈린 것은 그 책을 어디서 구했느냐입니다.</text>
</svg>
