<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', sans-serif">

  <defs>
    <linearGradient id="span" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A66BBE"/>
      <stop offset="100%" stop-color="#3FB6A8"/>
    </linearGradient>
  </defs>

  <text x="24" y="28" font-size="15" font-weight="700" fill="#808080">예시를 몇 개 줄지보다, 어떤 순서로 줄지가 더 흔듭니다</text>
  <text x="24" y="50" font-size="12" fill="#808080">내용이 같은 예시라도 배열을 바꾸면 성능이 이 폭 안 어디로든 떨어질 수 있습니다.</text>

  <text x="24" y="88" font-size="12" font-weight="700" fill="#808080">같은 예시, 순서만 바꿨을 때</text>

  <rect x="120" y="98" width="560" height="32" rx="6" fill="url(#span)"/>

  <path d="M112 114 L124 106 L124 122 Z" fill="#A66BBE"/>
  <path d="M688 114 L676 106 L676 122 Z" fill="#3FB6A8"/>

  <text x="120" y="152" font-size="11.5" font-weight="700" fill="#A66BBE">무작위 추측 수준</text>
  <text x="680" y="152" font-size="11.5" font-weight="700" text-anchor="end" fill="#3FB6A8">최고 성능 근접</text>

  <text x="400" y="120" font-size="11.5" font-weight="700" text-anchor="middle" fill="#ffffff">어느 순열이 어디에 떨어질지 미리 알 수 없다</text>

  <line x1="24" y1="182" x2="776" y2="182" stroke="#808080" stroke-width="1" stroke-opacity="0.25"/>

  <text x="24" y="212" font-size="12" font-weight="700" fill="#808080">왜 흔들리나 — 모델이 특정 답으로 치우치기 때문</text>

  <rect x="120" y="226" width="270" height="52" rx="6" fill="#A66BBE" fill-opacity="0.14" stroke="#A66BBE" stroke-opacity="0.5"/>
  <text x="255" y="248" font-size="12" font-weight="700" text-anchor="middle" fill="#808080">프롬프트 끝 근처에 놓인 답</text>
  <text x="255" y="266" font-size="10.5" text-anchor="middle" fill="#808080">마지막 예시의 정답 쪽으로 쏠린다</text>

  <rect x="410" y="226" width="270" height="52" rx="6" fill="#A66BBE" fill-opacity="0.14" stroke="#A66BBE" stroke-opacity="0.5"/>
  <text x="545" y="248" font-size="12" font-weight="700" text-anchor="middle" fill="#808080">사전학습에 흔한 답</text>
  <text x="545" y="266" font-size="10.5" text-anchor="middle" fill="#808080">자주 본 표현 쪽으로 쏠린다</text>

  <text x="24" y="312" font-size="11" fill="#808080">※ 범위의 양 끝(무작위 추측 ~ 최고 성능 근접)은 논문 초록의 표현을 그대로 옮긴 것입니다. 중간 분포는 그리지 않았습니다.</text>
  <text x="24" y="328" font-size="11" fill="#808080">   2021년 논문이고 주로 분류 과제 기준입니다. 지금 모델에서 폭이 같은지는 따로 확인해야 합니다.</text>
</svg>
